services:
  nginx:
    image: gimr-nginx:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: gimr-nginx
    ports:
      - "8880:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gimr-network

  backend:
    image: gimr-backend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: gimr-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.test
    environment:
      - DATABASE_URL=postgresql+asyncpg://gimr:gimr_password@postgres:5432/gimr
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_TLS_CA=
      - DOCKER_TLS_CERT=
      - DOCKER_TLS_KEY=
      - AUTO_MIGRATE=true
      - COOKIE_SECURE=false
      # Custom CA certificate for HTTPS connections (GitLab, Mattermost, etc.)
      # The CA certificate is baked into the image at /etc/ssl/certs/custom-ca.crt
      - CUSTOM_CA_BUNDLE=/etc/ssl/certs/custom-ca.crt
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - gimr-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  scheduler:
    image: gimr-backend:latest
    container_name: gimr-scheduler
    command: ["python3", "-m", "app.scheduler_service"]
    env_file:
      - .env.test
    environment:
      - DATABASE_URL=postgresql+asyncpg://gimr:gimr_password@postgres:5432/gimr
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_TLS_CA=
      - DOCKER_TLS_CERT=
      - DOCKER_TLS_KEY=
      - AUTO_MIGRATE=true
      # Custom CA certificate — mounted into scheduler and passed to workers
      - CUSTOM_CA_BUNDLE=/etc/ssl/certs/custom-ca.crt
      # Generic volume mounts for worker containers (JSON array)
      - "WORKER_VOLUME_MOUNTS=[{\"host_path\": \"/etc/ssl/certs/custom-ca.crt\", \"container_path\": \"/etc/ssl/certs/custom-ca.crt\", \"mode\": \"ro\"}]"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount CA certificate into scheduler (enable when CA cert file is provided at deployment)
      # - ./ca.crt:/etc/ssl/certs/custom-ca.crt:ro
    restart: unless-stopped
    networks:
      - gimr-network

  postgres:
    image: postgres:16-alpine
    container_name: gimr-postgres
    environment:
      POSTGRES_USER: gimr
      POSTGRES_PASSWORD: gimr_password
      POSTGRES_DB: gimr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - gimr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gimr -d gimr"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  e2e:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.e2e
    container_name: gimr-e2e
    environment:
      - E2E_BASE_URL=http://nginx:80
      - E2E_BACKEND_URL=http://backend:8000
      - E2E_GITLAB_URL=http://gitlab:8080
      - E2E_POSTGRES_URL=postgresql://gimr:gimr_password@postgres:5432/gimr
      - PYTEST_ARGS=-v
    depends_on:
      - nginx
      - backend
      - postgres
    networks:
      - gimr-network
    # Only run when explicitly started (not auto-started)
    profiles:
      - e2e

volumes:
  postgres_data:

networks:
  gimr-network:
    driver: bridge
