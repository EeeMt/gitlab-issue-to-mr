services:
  nginx:
    image: codify-nginx:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: codify-nginx
    ports:
      - "8880:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - codify-network

  backend:
    image: codify-backend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: codify-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.test
    environment:
      - DATABASE_URL=postgresql+asyncpg://codify:codify_password@postgres:5432/codify
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_TLS_CA=
      - DOCKER_TLS_CERT=
      - DOCKER_TLS_KEY=
      - WORKER_WORKSPACE_HOST_PATH=${WORKER_WORKSPACE_HOST_PATH:-/opt/codify-workspaces}
      - AUTO_MIGRATE=false
      # Plan §4.8: explicit harness execution mode; preflight compares the
      # values reported by the Backend and Scheduler /health endpoints.
      - HARNESS_EXECUTION_MODE=${HARNESS_EXECUTION_MODE:?set HARNESS_EXECUTION_MODE to dual_canary or v2_only}
      - COOKIE_SECURE=false
      # Custom CA certificate — mount from local file (not baked into image).
      # Place deploy/ca.crt on the Docker host; see .env.test for CUSTOM_CA_BUNDLE.
      # If absent, entrypoint falls back to git http.sslVerify=false.
      - CUSTOM_CA_BUNDLE=/etc/ssl/certs/custom-ca.crt
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /opt/codify-archives:/opt/codify-archives
      - type: bind
        source: ${CI_FAILURE_BUNDLE_HOST_PATH:-/opt/codify-ci-failures}
        target: ${WORKER_WORKSPACE_HOST_PATH:-/opt/codify-workspaces}/ci-failures
      - type: bind
        source: ${DOCKER_CERTS_HOST_PATH:-/opt/codify-docker-certs}
        target: /opt/codify-docker-certs
        read_only: true
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount CA cert (local-only, not in git — place /opt/ca.crt on Docker host)
      - type: bind
        #source: /Users/xiquan/ca.crt
        source: /opt/ca.crt
        target: /etc/ssl/certs/custom-ca.crt
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    networks:
      - codify-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  scheduler:
    image: codify-backend:latest
    container_name: codify-scheduler
    command: ["python3", "-m", "app.scheduler_service"]
    env_file:
      - .env.test
    environment:
      - DATABASE_URL=postgresql+asyncpg://codify:codify_password@postgres:5432/codify
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_TLS_CA=
      - DOCKER_TLS_CERT=
      - DOCKER_TLS_KEY=
      - WORKER_WORKSPACE_HOST_PATH=${WORKER_WORKSPACE_HOST_PATH:-/opt/codify-workspaces}
      - AUTO_MIGRATE=false
      # Must match the Backend value; the preflight script compares both.
      - HARNESS_EXECUTION_MODE=${HARNESS_EXECUTION_MODE:?set HARNESS_EXECUTION_MODE to dual_canary or v2_only}
      # Custom CA certificate is mounted from local file (not baked into image).
      # CUSTOM_CA_BUNDLE tells the scheduler and worker entrypoints where to find it.
      - CUSTOM_CA_BUNDLE=/etc/ssl/certs/custom-ca.crt
      # WORKER_CA_CERT_HOST_PATH: pass CA cert into spawned worker containers.
      # Set in .env.test to the absolute path of deploy/ca.crt on the Docker host.
      # Alternative: use WORKER_VOLUME_MOUNTS for a full JSON mount list.
      - WORKER_CA_CERT_HOST_PATH=${WORKER_CA_CERT_HOST_PATH:-}
      - WORKER_VOLUME_MOUNTS=${WORKER_VOLUME_MOUNTS:-}
      # Scheduler /health endpoint (execution mode for the preflight script).
      - SCHEDULER_HEALTH_PORT=${SCHEDULER_HEALTH_PORT:-8001}
    ports:
      - "${SCHEDULER_HEALTH_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - /opt/codify-archives:/opt/codify-archives
      - type: bind
        source: ${CI_FAILURE_BUNDLE_HOST_PATH:-/opt/codify-ci-failures}
        target: ${WORKER_WORKSPACE_HOST_PATH:-/opt/codify-workspaces}/ci-failures
      - type: bind
        source: ${DOCKER_CERTS_HOST_PATH:-/opt/codify-docker-certs}
        target: /opt/codify-docker-certs
        read_only: true
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount CA cert (local-only, not in git — place /opt/ca.crt on Docker host)
      - type: bind
        source: /opt/ca.crt
        target: /etc/ssl/certs/custom-ca.crt
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    networks:
      - codify-network

  # Maintenance-window migration owner. Run exactly once with a reviewed
  # revision, for example:
  # MIGRATION_TARGET=075_xxx docker compose --profile maintenance run --rm migrate
  migrate:
    profiles: ["maintenance"]
    image: codify-backend:latest
    env_file:
      - .env.test
    environment:
      - DATABASE_URL=postgresql+asyncpg://codify:codify_password@postgres:5432/codify
      - AUTO_MIGRATE=false
    command:
      - python3
      - -m
      - alembic
      - upgrade
      - ${MIGRATION_TARGET:?set MIGRATION_TARGET to the reviewed Alembic revision}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codify-network

  postgres:
    image: postgres:16-alpine
    container_name: codify-postgres
    environment:
      POSTGRES_USER: codify
      POSTGRES_PASSWORD: codify_password
      POSTGRES_DB: codify
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - "5432:5432"
    networks:
      - codify-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codify -d codify"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:

networks:
  codify-network:
    driver: bridge
