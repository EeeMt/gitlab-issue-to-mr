# V2 release overlay.  Keep this separate from the dual-canary base compose so
# legacy profiles do not receive a missing/empty bind mount. The host path is a
# non-secret, immutable Worker-image artifact identity document.
services:
  backend:
    environment:
      CODIFY_WORKER_CLI_ARTIFACT_MANIFEST: /run/codify/worker-cli-artifacts.json
    volumes:
      - type: bind
        source: ${CODIFY_WORKER_CLI_ARTIFACT_MANIFEST_HOST_PATH:?set CODIFY_WORKER_CLI_ARTIFACT_MANIFEST_HOST_PATH for V2 release}
        target: /run/codify/worker-cli-artifacts.json
        read_only: true
        bind:
          create_host_path: false
  scheduler:
    environment:
      CODIFY_WORKER_CLI_ARTIFACT_MANIFEST: /run/codify/worker-cli-artifacts.json
    volumes:
      - type: bind
        source: ${CODIFY_WORKER_CLI_ARTIFACT_MANIFEST_HOST_PATH:?set CODIFY_WORKER_CLI_ARTIFACT_MANIFEST_HOST_PATH for V2 release}
        target: /run/codify/worker-cli-artifacts.json
        read_only: true
        bind:
          create_host_path: false
