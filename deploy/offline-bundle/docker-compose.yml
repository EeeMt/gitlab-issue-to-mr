services:
  nginx:
    image: codify-nginx:latest
    container_name: codify-nginx
    ports:
      - "8880:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - codify-network

  backend:
    image: codify-backend:latest
    container_name: codify-backend
    ports:
      - "8000:8000"
    env_file:
      - ./config/.env.offline
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_TLS_CA=
      - DOCKER_TLS_CERT=
      - DOCKER_TLS_KEY=
      - WORKER_WORKSPACE_HOST_PATH=${WORKER_WORKSPACE_HOST_PATH:-/opt/codify-workspaces}
      - AUTO_MIGRATE=false
      - HARNESS_EXECUTION_MODE=${HARNESS_EXECUTION_MODE:?set HARNESS_EXECUTION_MODE to dual_canary or v2_only}
      - COOKIE_SECURE=false
      - CUSTOM_CA_BUNDLE=/etc/ssl/certs/custom-ca.crt
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${CI_FAILURE_BUNDLE_HOST_PATH:-/opt/codify-ci-failures}
        target: ${WORKER_WORKSPACE_HOST_PATH:-/opt/codify-workspaces}/ci-failures
      - type: bind
        source: ${DOCKER_CERTS_HOST_PATH:-/opt/codify-docker-certs}
        target: /opt/codify-docker-certs
        read_only: true
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount CA cert (place ca.crt at the source path on the Docker host).
      # If you don't use an internal CA, comment out this bind mount and
      # remove CUSTOM_CA_BUNDLE from the environment block above.
      - type: bind
        source: /opt/ca.crt
        target: /etc/ssl/certs/custom-ca.crt
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    networks:
      - codify-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  scheduler:
    image: codify-backend:latest
    container_name: codify-scheduler
    command: ["python3", "-m", "app.scheduler_service"]
    env_file:
      - ./config/.env.offline
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_TLS_CA=
      - DOCKER_TLS_CERT=
      - DOCKER_TLS_KEY=
      - WORKER_WORKSPACE_HOST_PATH=${WORKER_WORKSPACE_HOST_PATH:-/opt/codify-workspaces}
      - AUTO_MIGRATE=false
      - HARNESS_EXECUTION_MODE=${HARNESS_EXECUTION_MODE:?set HARNESS_EXECUTION_MODE to dual_canary or v2_only}
      - CUSTOM_CA_BUNDLE=/etc/ssl/certs/custom-ca.crt
      - WORKER_CA_CERT_HOST_PATH=${WORKER_CA_CERT_HOST_PATH:-}
      - WORKER_VOLUME_MOUNTS=${WORKER_VOLUME_MOUNTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${CI_FAILURE_BUNDLE_HOST_PATH:-/opt/codify-ci-failures}
        target: ${WORKER_WORKSPACE_HOST_PATH:-/opt/codify-workspaces}/ci-failures
      - type: bind
        source: ${DOCKER_CERTS_HOST_PATH:-/opt/codify-docker-certs}
        target: /opt/codify-docker-certs
        read_only: true
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount CA cert (place ca.crt at the source path on the Docker host).
      # If you don't use an internal CA, comment out this bind mount and
      # remove CUSTOM_CA_BUNDLE from the environment block above.
      - type: bind
        source: /opt/ca.crt
        target: /etc/ssl/certs/custom-ca.crt
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    networks:
      - codify-network

  migrate:
    profiles: ["maintenance"]
    image: codify-backend:latest
    env_file:
      - ./config/.env.offline
    environment:
      - AUTO_MIGRATE=false
    command:
      - python3
      - -m
      - alembic
      - upgrade
      - ${MIGRATION_TARGET:?set MIGRATION_TARGET to the reviewed Alembic revision}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - codify-network

  postgres:
    image: postgres:16-alpine
    container_name: codify-postgres
    env_file:
      - ./config/.env.offline
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - codify-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codify -d codify"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:

networks:
  codify-network:
    driver: bridge
