services:
  nginx:
    image: gimr-nginx:latest
    container_name: gimr-nginx
    ports:
      - "8880:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - gimr-network

  backend:
    image: gimr-backend:latest
    container_name: gimr-backend
    ports:
      - "8000:8000"
    env_file:
      - ./config/.env.offline
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_TLS_CA=
      - DOCKER_TLS_CERT=
      - DOCKER_TLS_KEY=
      - AUTO_MIGRATE=false
      - CUSTOM_CA_BUNDLE=
    depends_on:
      - postgres
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Uncomment and adjust to mount a custom CA certificate:
      # - /path/to/ca.crt:/certs/ca.crt:ro
    restart: unless-stopped
    networks:
      - gimr-network

  scheduler:
    image: gimr-backend:latest
    container_name: gimr-scheduler
    command: ["python3", "-m", "app.scheduler_service"]
    env_file:
      - ./config/.env.offline
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_TLS_CA=
      - DOCKER_TLS_CERT=
      - DOCKER_TLS_KEY=
      - AUTO_MIGRATE=true
      - CUSTOM_CA_BUNDLE=
    depends_on:
      - postgres
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Uncomment and adjust to mount a custom CA certificate:
      # - /path/to/ca.crt:/certs/ca.crt:ro
    restart: unless-stopped
    networks:
      - gimr-network

  postgres:
    image: postgres:16-alpine
    container_name: gimr-postgres
    env_file:
      - ./config/.env.offline
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - gimr-network

volumes:
  postgres_data:

networks:
  gimr-network:
    driver: bridge
