services:
  nginx:
    image: gimr-nginx:latest
    container_name: gimr-nginx
    ports:
      - "8880:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gimr-network

  backend:
    image: gimr-backend:latest
    container_name: gimr-backend
    ports:
      - "8000:8000"
    env_file:
      - ./config/.env.offline
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_TLS_CA=
      - DOCKER_TLS_CERT=
      - DOCKER_TLS_KEY=
      - AUTO_MIGRATE=true
      - COOKIE_SECURE=false
      - CUSTOM_CA_BUNDLE=/etc/ssl/certs/custom-ca.crt
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - gimr-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  scheduler:
    image: gimr-backend:latest
    container_name: gimr-scheduler
    command: ["python3", "-m", "app.scheduler_service"]
    env_file:
      - ./config/.env.offline
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_TLS_CA=
      - DOCKER_TLS_CERT=
      - DOCKER_TLS_KEY=
      - AUTO_MIGRATE=true
      - CUSTOM_CA_BUNDLE=/etc/ssl/certs/custom-ca.crt
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - gimr-network

  postgres:
    image: postgres:16-alpine
    container_name: gimr-postgres
    env_file:
      - ./config/.env.offline
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - gimr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gimr -d gimr"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:

networks:
  gimr-network:
    driver: bridge
