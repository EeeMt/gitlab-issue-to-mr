[project]
name = "codify"
version = "0.1.0"
description = "Codify - AI-powered code generation from issues"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "python-gitlab>=4.4.0",
    "docker>=7.0.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/mock_integration", "tests/mock_e2e"]
norecursedirs = [
    "tests/e2e",
    "tests/gitlab_e2e",
    "tests/mock_server",
    "*.egg-info",
    ".*",
    "_build",
    "build",
    "dist",
    "venv",
    ".venv",
]
addopts = "--ignore=tests/e2e --ignore=tests/gitlab_e2e"
markers = [
    "slow: marks tests as slow-running (use -m 'not slow' to skip)",
]
filterwarnings = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "F401",  # unused-import
    "F541",  # f-string-missing-placeholders
    "F811",  # redefined-while-unused
    "F821",  # undefined-name
    "F841",  # unused-variable
    "I001",  # unsorted-imports
    "UP006", # non-pep585-annotation
    "UP017", # datetime-timezone-utc
    "UP037", # quoted-annotation
    "UP041", # timeout-error-alias
    "UP045", # non-pep604-annotation-optional
    "SIM114",# if-with-same-arms
    "SIM300",# yoda-conditions
    "SIM910",# dict-get-with-none-default
    "C420",  # unnecessary-dict-comprehension-for-iterable
    "PT001", # pytest-fixture-incorrect-parentheses-style
    "PT022", # pytest-useless-yield-fixture
    "E401",  # multiple-imports-on-one-line
    "W291",  # trailing-whitespace
    "W293",  # blank-line-with-whitespace
]
