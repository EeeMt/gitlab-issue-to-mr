[pytest]
# Pytest configuration for E2E tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -n auto
    --dist=loadfile

# Markers
markers =
    auth: authentication flow tests
    access: access management tests
    bootstrap: bootstrap page tests
    create_task: create task page tests
    dashboard: dashboard page tests
    manual_task: manual task page tests
    navigation: navigation tests
    prompt_template: prompt template management tests
    serial: tests that require serial execution (modify shared DB state)
    slow: slow running tests
    task_details: task details page tests
    task_view: task view page tests
    login: login page tests
    sessions: sessions management tests
    monitor: system monitor page tests
    analytics: analytics page tests
    config_tabs: configuration tab panel tests
    schedule_overview: schedule overview page tests
    oidc_diagnostics: OIDC diagnostics page tests
    shell: app shell navigation and interaction tests
    slot_capacity: slot capacity feature tests (config, create-task, schedule, heatmap)

# Async support — Note: pytest-asyncio is not used in E2E tests (Playwright is sync)

# Logging
log_cli = false
log_cli_level = INFO
