[pytest]
# Pytest configuration for E2E tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    auth: authentication flow tests
    bootstrap: bootstrap page tests
    dashboard: dashboard page tests
    navigation: navigation tests
    slow: slow running tests

# Async support
asyncio_mode = auto

# Logging
log_cli = false
log_cli_level = INFO
